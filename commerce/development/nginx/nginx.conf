
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream commerce_api {
        # Required for dynamic DNS resolution
        zone commerce_api 64k;

        # Distribute requests to instances with fewer connections
        least_conn;

        # Resolve all scaled Compose containers dynamically
        server commerce-api:3000 resolve;
    }

    server {
        listen 8001;
        server_name _;

        location / {
            proxy_pass http://commerce_api;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
