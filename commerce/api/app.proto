syntax = "proto3";

package app.v1;

import "status.proto";

message GetInfoRequest {
  string status = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;
}

message GetInfoResponse {
  status.Status status = 1;
}

service AppService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {}
}
