type: object
required:
  - email
  - name
  - item_id
  - quantity
  - promotion_id
properties:
  email:
    type: string
  name:
    type: string
  item_id:
    type: string
  quantity:
    type: string
    format: decimal
    description: decimal
  promotion_id:
    type: string
    description: we set this field as required since we'd like to enforce the strict 1 product, 1 quantity per-user, we assume we can use this endpoint for non-flashsale order as well in the future
