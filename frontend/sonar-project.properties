
sonar.organization=bookipi
sonar.projectKey=bookipi_frontend
sonar.projectName=bookipi_frontend

sonar.sources=src
sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  coverage/**,\
  public/**,\
  src/main.tsx,\
  src/assets/**,\
  src/**.d.ts,\
  src/components/App/App.tsx,\
  src/services/openapi/**,\
  src/services/orvalapi/**,\
  src/services/react/**,\
  **/index.ts

sonar.tests=src
sonar.test.inclusions=\
  **/*.test.js,\
  **/*.test.ts,\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/*.test.jsx,\
  **/*.test.tsx,\
  **/*.spec.jsx,\
  **/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info