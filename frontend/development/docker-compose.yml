name: bookipi-frontend
version: "3"
services:
  frontend-app:
    build:
      context: ../
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 80
    env_file:
      - ../.env
    networks:
      - frontend-net
  frontend:
    image: nginx:1.29-alpine
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-app
    networks:
      - frontend-net
networks:
  frontend-net:
    driver: bridge
